<header class="app-header">
  <div class="app-container h-100 d-flex align-items-center gap-3">
    <a routerLink="/dashboard" class="brand" aria-label="GRAP SOP Management, go to dashboard">
      <!-- The logo file has a white background, so it sits on a white tile. -->
      <span class="brand-mark">
        <img src="axis.png" alt="" width="22" height="22" />
      </span>
      <span class="brand-bank">AXIS BANK</span>
      <span class="brand-rule" aria-hidden="true"></span>
      <span class="brand-product">
        <span class="brand-name">GRAP</span>
        <span class="brand-sub">SOP Management</span>
      </span>
    </a>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <app-notification-bell [userId]="user.id"></app-notification-bell>

      <div #userMenu class="user-menu">
        <button
          #userButton
          type="button"
          class="user-button"
          [class.is-open]="menuOpen"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen"
          aria-controls="userPanel"
          [attr.aria-label]="'Account menu for ' + user.name"
        >
          <span class="avatar" aria-hidden="true">{{ initials }}</span>

          <span class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-role">{{ user.role }}</span>
          </span>

          <i class="bi bi-chevron-down chevron" aria-hidden="true"></i>
        </button>

        @if (menuOpen) {
          <div id="userPanel" class="user-panel">
            <div class="user-card">
              <span class="avatar avatar-lg" aria-hidden="true">{{ initials }}</span>

              <div>
                <p class="card-name">{{ user.name }}</p>
                <p class="card-email">{{ user.email }}</p>
                <p class="card-meta">{{ user.role }}, employee ID {{ user.id }}</p>
              </div>
            </div>

            <button type="button" class="menu-item" (click)="signOut()">
              <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
              Sign out
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
