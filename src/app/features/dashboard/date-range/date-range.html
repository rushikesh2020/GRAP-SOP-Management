<div class="field" [class.is-open]="open">
  <button
    #trigger
    type="button"
    class="trigger"
    (click)="toggle()"
    [attr.aria-expanded]="open"
    aria-controls="dateRangePanel"
    [attr.aria-labelledby]="labelId + ' dateRangeValue'"
  >
    <i class="bi bi-calendar3" aria-hidden="true"></i>
    <span id="dateRangeValue" class="value" [class.is-empty]="!hasValue">{{ summary }}</span>
  </button>

  @if (hasValue) {
    <button type="button" class="clear" (click)="clear()" aria-label="Clear date range">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  }
</div>

@if (open) {
  <div id="dateRangePanel" class="panel" role="dialog" aria-label="Choose a date range">
    <ul class="presets">
      @for (preset of presets; track preset.label) {
        <li>
          <button type="button" class="preset" (click)="applyPreset(preset)">
            {{ preset.label }}
          </button>
        </li>
      }
      <li>
        <button type="button" class="preset" (click)="clear()">Any date</button>
      </li>
    </ul>

    <div class="calendar">
      <div class="calendar-head">
        <button type="button" class="nav" (click)="previousMonth()" aria-label="Previous month">
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>

        <span class="month" aria-live="polite">{{ monthTitle }}</span>

        <button type="button" class="nav" (click)="nextMonth()" aria-label="Next month">
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </div>

      <div class="grid">
        @for (weekday of weekdays; track weekday) {
          <span class="weekday" aria-hidden="true">{{ weekday }}</span>
        }

        @for (day of days; track day.iso) {
          <button
            type="button"
            class="day"
            [class.outside]="!day.inMonth"
            [class.today]="day.isToday"
            [class.start]="isStart(day.iso)"
            [class.end]="isEnd(day.iso)"
            [class.between]="inRange(day.iso)"
            [attr.aria-label]="day.label"
            [attr.aria-pressed]="isStart(day.iso) || isEnd(day.iso)"
            (click)="pickDay(day.iso)"
          >
            {{ day.day }}
          </button>
        }
      </div>

      <p class="hint">
        {{ pendingStart ? 'Now pick the end date.' : 'Pick a start date, then an end date.' }}
      </p>
    </div>
  </div>
}
