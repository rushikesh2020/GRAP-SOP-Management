<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card text-center shadow-sm p-5" style="max-width: 500px">
    <i class="bi bi-shield-exclamation display-4 text-axis" aria-hidden="true"></i>

    <h2 class="mt-3">Access not assigned</h2>

    <p class="text-muted">Your account has not been assigned a role in the GRAP application.</p>

    <p>Please contact your application administrator to request access.</p>

    @if (currentUser$ | async; as user) {
      <div class="bg-light rounded p-3 mb-3">
        <small class="text-muted">Signed in as</small>
        <div class="fw-semibold">{{ user.name }}</div>
        <div>{{ user.email }}</div>
      </div>
    }

    <button class="btn btn-primary" (click)="signOut()">Sign out</button>
  </div>
</div>
