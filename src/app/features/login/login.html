<div class="login-container">
  <div class="card login-card shadow-sm p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-logo mb-3">
        <span class="brand-mark">
          <img src="axis.png" alt="" width="28" height="28" />
        </span>
        AXIS BANK
      </div>

      <h1 class="text-axis fw-bold">GRAP</h1>

      <h4>SOP Management</h4>

      <p class="text-muted small">Grievance Resolution Automation Program</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="signIn()">
      <fieldset class="mb-4">
        <legend class="form-label fs-6 fw-semibold">Choose demo account</legend>

        @for (user of users; track user.id) {
          <div class="form-check border rounded p-3 ps-5 mb-2">
            <input
              type="radio"
              class="form-check-input"
              [id]="user.id"
              [value]="user.id"
              formControlName="userId"
            />

            <label class="form-check-label w-100" [for]="user.id">
              <span class="fw-semibold">
                {{ user.name }}
              </span>

              <span class="d-block text-muted small">
                {{ user.role }}
              </span>
            </label>
          </div>
        }
      </fieldset>

      @if (errorMessage) {
        <div class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="btn btn-primary w-100 py-3" [disabled]="loginForm.invalid">
        <i class="bi bi-shield-check me-2" aria-hidden="true"></i>

        Sign in with Axis SSO
      </button>
    </form>

    <p class="text-center text-muted small mt-3">
      Use your bank Microsoft account. No separate password required.
    </p>

    <hr />

    <p class="text-center text-muted small mb-0">Demo environment. Sign-in is simulated.</p>
  </div>
</div>
